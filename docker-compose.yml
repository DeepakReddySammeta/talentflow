services:
  postgres:
    image: postgres:16-alpine
    container_name: ats_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ats_user
      POSTGRES_PASSWORD: ats_password
      POSTGRES_DB: ats_db
    ports:
      - "5432:5432"
    volumes:
      - ats_pgdata:/var/lib/postgresql/data

volumes:
  ats_pgdata:
